services:
  postgres:
    image: postgres:16-alpine
    container_name: orion-postgres-dev
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion_dev_password
      POSTGRES_DB: orion
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: orion-redis-dev
    ports:
      - "6379:6379"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: orion-mosquitto-dev
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.dev.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

volumes:
  postgres_dev_data:
